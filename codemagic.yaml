workflows:
  android-release:
    name: Android - AAB firmato per Play Store
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      # Team settings -> Code signing identities -> Android keystores ->
      # crea un keystore (Codemagic lo genera e lo custodisce lui): il nome
      # dato li' va messo qui sotto. NON perdere/rigenerare questo keystore
      # dopo la prima release: Play Store richiede la stessa firma per ogni
      # aggiornamento futuro dell'app, per sempre.
      android_signing:
        - focused_release_keystore
      groups:
        - google_play
    scripts:
      - name: Installa dipendenze npm
        script: npm ci
      - name: Build del sito (dist/)
        script: npm run build
      - name: Sincronizza Capacitor -> Android
        script: npx cap sync android
      - name: Build AAB firmato
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - danimandurinz2010@gmail.com
      # Facoltativo: pubblica direttamente su una traccia di test di Play
      # Console invece di scaricare l'AAB a mano. Richiede una service
      # account key JSON caricata come variabile d'ambiente cifrata
      # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS nel gruppo "google_play".
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal

  ios-release:
    name: iOS - IPA firmato per App Store / TestFlight
    max_build_duration: 60
    # Team settings -> Integrations -> App Store Connect -> il nome dato li'
    # alla connessione con la API key (.p8 + Issuer ID + Key ID) va qui:
    # e' questo che da' agli script sotto le credenziali per creare
    # certificati/profili in automatico. Senza questo blocco, "ios_signing"
    # da solo NON basta e la build fallisce prima ancora di arrivare agli
    # script, con "No matching profiles found".
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.focusedapp.app
    scripts:
      - name: Installa dipendenze npm
        script: npm ci
      - name: Build del sito (dist/)
        script: npm run build
      - name: Sincronizza Capacitor -> iOS
        script: npx cap sync ios
      - name: Aggiorna build number (Apple rifiuta un build number gia' usato)
        script: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $CM_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Firma automatica (certificati + provisioning profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "org.focusedapp.app" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA firmato
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - danimandurinz2010@gmail.com
      # Carica l'IPA direttamente su TestFlight a ogni build riuscita, usando
      # la stessa integrazione App Store Connect di "integrations" sopra —
      # non serve piu' scaricare l'IPA e caricarlo a mano con Transporter.
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-debug:
    name: Android - Debug APK (test su telefono, nessuna firma richiesta)
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Installa dipendenze npm
        script: npm ci
      - name: Build del sito (dist/)
        script: npm run build
      - name: Sincronizza Capacitor -> Android
        script: npx cap sync android
      - name: Build APK debug
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - danimandurinz2010@gmail.com

  # iOS: una build reale su dispositivo fisico richiede un account Apple
  # Developer Program ($99/anno) e certificati/provisioning profile — non
  # ancora configurati. Per ora questa workflow builda solo per il
  # Simulatore iOS (nessuna firma necessaria), utile per verificare che il
  # progetto compili correttamente. Va aggiornata con la firma automatica di
  # Codemagic (App Store Connect API key) appena sono disponibili le
  # credenziali Apple.
  ios-simulator:
    name: iOS - Build per Simulatore (nessuna firma, solo verifica build)
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Installa dipendenze npm
        script: npm ci
      - name: Build del sito (dist/)
        script: npm run build
      - name: Sincronizza Capacitor -> iOS
        script: npx cap sync ios
      - name: Build per Simulatore iOS
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build
    artifacts:
      - build/Build/Products/**/*.app
    publishing:
      email:
        recipients:
          - danimandurinz2010@gmail.com
